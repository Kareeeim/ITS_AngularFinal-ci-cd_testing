@switch (tipo) {
  @case ('Router') {
    <!-- Router: scatola con due antenne -->
    <svg
      [class]="classe"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="3" y="11" width="18" height="9" rx="2" />
      <path d="M8 11 5.5 5.2" />
      <path d="M16 11l2.5-5.8" />
      <path d="M7 15.5h2.5" />
      <path d="M12.5 15.5h4.5" />
    </svg>
  }
  @case ('Switch') {
    <!-- Switch: scatola con due frecce contrapposte -->
    <svg
      [class]="classe"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="2" y="7" width="20" height="10" rx="2" />
      <path d="M6 10.5h6.5" />
      <path d="M10.5 8.5 12.5 10.5 10.5 12.5" />
      <path d="M18 13.5h-6.5" />
      <path d="M13.5 11.5 11.5 13.5 13.5 15.5" />
    </svg>
  }
  @default {
    <!-- PC: monitor con piedistallo -->
    <svg
      [class]="classe"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="2.5" y="4" width="19" height="12.5" rx="1.5" />
      <path d="M12 16.5v4" />
      <path d="M8.5 20.5h7" />
    </svg>
  }
}
