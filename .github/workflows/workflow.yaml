# Pipeline di integrazione continua: esegue i test unitari e la build di produzione.
name: Angular CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Il token di default viene usato in sola lettura: la pipeline non deve poter
# scrivere sul repository.
permissions:
  contents: read

# Se viene pushato un nuovo commit sullo stesso branch, la run precedente
# viene annullata per non sprecare minuti di CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Test unitari (Vitest + jsdom) su più versioni di Node.js
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Se una versione di Node fallisce, le altre continuano comunque.
      fail-fast: false
      matrix:
        # Angular 21 richiede Node ^20.19.0 || ^22.12.0 || >=24.0.0.
        node-version: [24.x, 26.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Riutilizza la cache di npm tra una run e l'altra.
          cache: npm

      # npm ci installa esattamente le versioni di package-lock.json.
      - name: Install dependencies
        run: npm ci

      # --watch=false: senza TTY il builder non resta in ascolto, ma lo rendiamo
      # esplicito così il comando funziona anche in locale.
      - name: Run unit tests
        run: npm test -- --watch=false

  # ---------------------------------------------------------------------------
  # Build di produzione (parte solo se i test sono verdi)
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      # Rende scaricabile l'esito della build dalla pagina della run.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/rete_canvas/browser
          # L'artefatto non serve a lungo, evitiamo di consumare spazio.
          retention-days: 7
